version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-encryption-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.master_key:/app/.master_key
      - ./keys.db:/app/keys.db
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
